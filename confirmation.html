<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Status – Hood Fiesta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark}*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Poppins,system-ui,sans-serif;color:#f7f3e8;background:radial-gradient(circle at 20% 15%,rgba(255,46,126,.35),transparent 40%),radial-gradient(circle at 85% 25%,rgba(255,194,26,.3),transparent 40%),#04321f}
.c{background:#0f241a;border-top:8px solid #ffc21a;border-radius:22px;max-width:480px;width:100%;padding:30px;text-align:center}
h1{font-family:'Lilita One';font-weight:400;font-size:2.2rem;color:#ffc21a}
p{color:#b9c9bf;margin:8px 0}
.ref{background:rgba(255,194,26,.12);border:2px dashed #ffc21a;border-radius:14px;padding:14px;margin:18px 0}
.ref small{display:block;color:#b9c9bf;letter-spacing:2px;font-size:.7rem}.ref b{font-family:'Lilita One';font-weight:400;font-size:1.9rem;letter-spacing:2px;color:#f7f3e8}
.btn{display:inline-block;margin-top:14px;padding:12px 26px;border-radius:40px;font-weight:700;text-decoration:none;color:#2a1c00;background:linear-gradient(135deg,#ffc21a,#ff6a1a)}
</style></head><body><div class="c" id="c"><h1>Checking payment…</h1><p>Please wait a moment.</p></div>
<script>
const c=document.getElementById('c'),q=new URLSearchParams(location.search),ref=q.get('reference')||q.get('trxref');
const home='<a class="btn" href="/">Back to Hood Fiesta</a>';
const clean=t=>String(t==null?'':t).replace(/[<>&"']/g,'');
function show(h){c.innerHTML=h+home}
(async()=>{
 if(!ref)return show('<h1>No payment found</h1><p>We could not find a payment reference.</p>');
 try{const j=await (await fetch('/api/verify?reference='+encodeURIComponent(ref))).json();
  if(j.status==='success')show(`<h1>Payment confirmed 🎉</h1><p>Thank you${j.name?', '+clean(j.name):''}! <b>${clean(j.street)}</b> is registered for the ${clean(j.competition)}.</p><div class="ref"><small>YOUR REFERENCE NUMBER</small><b>${clean(j.reference)}</b></div><p>A confirmation email is being sent to <b>${clean(j.email)}</b>. Keep this reference number — you will need it at screening. (Check your spam folder if you don't see it within a few minutes.)</p>`);
  else if(j.status==='abandoned'||j.status==='failed')show('<h1>Payment not completed</h1><p>Your payment did not go through, so you are not registered yet. Please try again from the registration section.</p>');
  else if(j.status==='pending'||j.status==='ongoing')show('<h1>Payment pending</h1><p>We are still waiting for confirmation. Refresh this page in a minute.</p>');
  else show('<h1>We could not confirm this payment</h1><p>If money left your account, please WhatsApp 09020757238 with reference <b>'+clean(ref)+'</b>.</p>');
 }catch(e){show('<h1>Something went wrong</h1><p>Please refresh, or WhatsApp 09020757238 with reference <b>'+clean(ref)+'</b>.</p>')}
})();
</script></body></html>
